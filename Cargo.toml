[workspace]
members = [
    "crates/hangar-core",
    "crates/hangar-uniffi",
    "apps/cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "5"
libc = "0.2"
open = "5"
uniffi = "=0.32.1"
thiserror = "2"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
