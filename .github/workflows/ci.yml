name: CI · CLI/Core
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/hangar-core/**'
      - 'apps/cli/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/hangar-core/**'
      - 'apps/cli/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: CLI/Core · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy -p hangar-core -p hangar --all-targets -- -D warnings
      - run: cargo test -p hangar-core -p hangar
