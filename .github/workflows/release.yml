name: Release · CLI

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches CLI Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CARGO_VERSION="v$(grep '^version' apps/cli/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "error: tag '$TAG' does not match apps/cli/Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          echo "OK: $TAG"

  build:
    name: Build · ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release -p hangar --target ${{ matrix.target }}
          else
            cargo build --release -p hangar --target ${{ matrix.target }}
          fi

      - name: Stage artifact
        run: cp target/${{ matrix.target }}/release/hangar hangar-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hangar-${{ matrix.artifact }}
          path: hangar-${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/hangar-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
