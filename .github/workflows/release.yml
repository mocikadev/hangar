name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches cli/gui Cargo.toml versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          for CRATE in crates/cli crates/gui; do
            CARGO_VERSION="v$(grep '^version' $CRATE/Cargo.toml | head -1 | cut -d'"' -f2)"
            if [ "$TAG" != "$CARGO_VERSION" ]; then
              echo "error: tag '$TAG' does not match $CRATE/Cargo.toml version '$CARGO_VERSION'"
              exit 1
            fi
          done
          TAURI_VERSION="v$(grep '"version"' crates/gui/tauri.conf.json | head -1 | cut -d'"' -f4)"
          if [ "$TAG" != "$TAURI_VERSION" ]; then
            echo "error: tag '$TAG' does not match tauri.conf.json version '$TAURI_VERSION'"
            exit 1
          fi
          echo "OK: $TAG"

  build:
    name: Build · ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-amd64
            bundles: "deb rpm appimage"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-arm64
            bundles: "deb"
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-amd64
            bundles: "dmg"
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-arm64
            bundles: "dmg"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
            artifact: windows-x86_64
            bundles: "nsis"

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} &&
            cross build --release -p hangar-gui --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }} &&
            cargo build --release -p hangar-gui --target ${{ matrix.target }}
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release -p hangar-gui --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/hangar hangar-${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\hangar.exe hangar-${{ matrix.artifact }}.exe

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle installers
        working-directory: crates/gui
        run: cargo tauri bundle --config tauri.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.target }} --ci

      - name: Stage installers
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*-setup.exe" \) -exec cp {} . \;
          ls hangar-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangar-${{ matrix.artifact }}
          path: |
            hangar-${{ matrix.artifact }}*
            *.deb
            *.rpm
            *.dmg
            *.AppImage
            *-setup.exe
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum hangar-* *.deb *.dmg *.AppImage *-setup.exe 2>/dev/null > SHA256SUMS.txt; cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hangar-*
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*-setup.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
