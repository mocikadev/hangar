name: Release · GUI

on:
  push:
    tags:
      - 'gui-v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Verify GUI release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches GUI and bundle versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          CARGO_VERSION="gui-v$(grep '^version' crates/gui/Cargo.toml | head -1 | cut -d'"' -f2)"
          TAURI_VERSION="gui-v$(grep '"version"' crates/gui/tauri.conf.json | head -1 | cut -d'"' -f4)"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "error: tag '$TAG' does not match crates/gui/Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          if [ "$TAG" != "$TAURI_VERSION" ]; then
            echo "error: tag '$TAG' does not match tauri.conf.json version '$TAURI_VERSION'"
            exit 1
          fi
          echo "OK: $TAG"

  build:
    name: Build GUI · ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-amd64
            bundles: "deb rpm appimage"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            artifact: linux-arm64
            bundles: "deb"
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-amd64
            bundles: "dmg"
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
            artifact: macos-arm64
            bundles: "dmg"

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build GUI
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release -p hangar-gui --target ${{ matrix.target }}
          else
            cargo build --release -p hangar-gui --target ${{ matrix.target }}
          fi

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle installers
        working-directory: crates/gui
        run: cargo tauri bundle --config tauri.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.target }} --ci

      - name: Stage installers
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.AppImage" \) -exec cp {} . \;
          find . -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.AppImage" \) -print

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hangar-gui-${{ matrix.artifact }}
          path: |
            *.deb
            *.rpm
            *.dmg
            *.AppImage
          retention-days: 1

  release:
    name: Create GUI GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: false
