name: CI · GUI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/gui/**'
      - '.github/workflows/gui-ci.yml'
      - '.github/workflows/gui-release.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/core/**'
      - 'crates/gui/**'
      - '.github/workflows/gui-ci.yml'
      - '.github/workflows/gui-release.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: GUI · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy -p hangar-gui --all-targets -- -D warnings
      - run: cargo test -p hangar-gui
