[package]
name = "hangar-linux"
version = "0.7.0"
edition = "2021"
rust-version = "1.98.1"
description = "Hangar GNOME native account dashboard"
license = "MIT"

[[bin]]
name = "hangar-desktop"
path = "src/main.rs"

[dependencies]
hangar-core = { path = "../../crates/hangar-core" }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }
ksni = { version = "=0.3.6", features = ["blocking"] }
